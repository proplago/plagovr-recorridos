<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Prueba de teléfono · PLAGO VR</title>
<style>body{font:17px/1.4 -apple-system,Helvetica,Arial,sans-serif;margin:0;padding:18px;background:#fff;color:#191919}h1{font-size:22px;margin:0 0 4px}p{color:#595959;margin:0 0 14px}
li{list-style:none;padding:10px 12px;border:1px solid #e3e3e3;border-radius:4px;margin:0 0 8px}.ok{border-color:#2e7d32;background:#eef7ee}.no{border-color:#b3261e;background:#fbeeed}small{display:block;color:#595959;font-size:13px;word-break:break-all}
a{display:inline-block;margin-top:10px;padding:12px 16px;background:#191919;color:#fff;border-radius:4px;text-decoration:none}</style></head>
<body><h1>Prueba de teléfono</h1><p>Espera 10 segundos y mándale captura de esta pantalla a Fernando / PLAGO VR.</p>
<ul id="r"><li class="ok">1. La página abre <small id="ua"></small></li></ul>
<a href="../el-jalisciense-dev/">Abrir la maqueta</a>
<script>
var r=document.getElementById('r'); document.getElementById('ua').textContent=navigator.userAgent+' · pantalla '+screen.width+'×'+screen.height+' · dpr '+devicePixelRatio;
function add(ok,t,d){var li=document.createElement('li');li.className=ok?'ok':'no';li.innerHTML=(ok?'✔ ':'✖ ')+t+(d?'<small>'+d+'</small>':'');r.appendChild(li);}
add(true,'2. JavaScript funciona');
try{var c=document.createElement('canvas'),g2=c.getContext('webgl2'),g=g2||c.getContext('webgl');
 if(g){var dbg=g.getExtension('WEBGL_debug_renderer_info');add(true,'3. 3D (WebGL'+(g2?'2':'1')+') disponible',dbg?g.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'');}
 else add(false,'3. 3D (WebGL) NO disponible','Revisa que el navegador no esté en modo ahorro / bloqueo de contenido');}catch(e){add(false,'3. Error al revisar 3D',String(e));}
add(typeof WebAssembly==='object','4. WebAssembly '+(typeof WebAssembly==='object'?'disponible':'NO disponible'));
var t0=Date.now();
fetch('../el-jalisciense-dev/models/ELJ_ARQ.glb',{cache:'no-store'}).then(function(x){return x.arrayBuffer().then(function(b){add(x.ok,'5. Descarga del modelo '+(x.ok?'OK':'falló ('+x.status+')'),(b.byteLength/1e6).toFixed(1)+' MB en '+((Date.now()-t0)/1000).toFixed(1)+' s');});}).catch(function(e){add(false,'5. No se pudo descargar el modelo',String(e));});
fetch('../el-jalisciense-dev/app.js',{cache:'no-store'}).then(function(x){add(x.ok,'6. Programa de la maqueta '+(x.ok?'OK':'falló ('+x.status+')'));}).catch(function(e){add(false,'6. No se pudo descargar el programa',String(e));});
</script></body></html>
